name: Feature Request
description: Suggest an idea or enhancement for a2wave
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Note that a2wave has explicit product boundaries (the
        "Iron Rules" in [AGENTS.md](../../AGENTS.md)) — e.g. it orchestrates rather
        than executes, and extends through Skills + MCP rather than hardcoded logic.
        Requests that cross those boundaries may need maintainer discussion first.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated, including whether a Skill or MCP Server could solve this instead.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, or links that help explain the request.
